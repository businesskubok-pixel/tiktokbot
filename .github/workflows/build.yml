
name: Build RodeoTikTokLive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Kompiluj plugin
        working-directory: paper-plugin
        run: gradle clean build --no-daemon

      - name: Udostepnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: RodeoTikTokLive-1.0
          path: paper-plugin/build/libs/*.jar
          if-no-files-found: error
